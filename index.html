<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>PrimeStrategy Ghana Ltd. — Turning Data into Decisions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/hub.css">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #0c1428;
    }

    /* ═══════════════════════════════════════════════
       DESKTOP STYLES (≥ 901px)
       ═══════════════════════════════════════════════ */
    @media (min-width: 901px) {
      body, html {
        height: 100%;
        overflow: hidden;
      }

      .bg-video {
        position: absolute;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 0;
        filter: brightness(0.35); 
        animation: slowZoom 25s linear infinite alternate;
      }

      .hub {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100vh;
        z-index: 5;
        background: transparent !important;
      }

      .hero-header {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        padding-top: 8vh; 
        padding-bottom: 2vh;
        background: linear-gradient(to bottom, rgba(12,20,40,0.95) 0%, rgba(12,20,40,0.6) 60%, transparent 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }

      .hero-footer-buttons {
        position: absolute;
        bottom: 4vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 1rem;
        pointer-events: auto;
        
        opacity: 0;
        animation: fadeUp 1.2s ease-out forwards;
        animation-delay: 2.6s;
      }

      .hub__topbar {
        position: absolute;
        top: 20px; left: 20px;
        z-index: 20;
      }
    }

    /* ═══════════════════════════════════════════════
       MOBILE STYLES (≤ 900px)
       ═══════════════════════════════════════════════ */
    @media (max-width: 900px) {
      body, html {
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
      }

      /* Ensure video is fixed and behind everything */
      .bg-video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: -2; /* Pushed far back */
        filter: brightness(0.3); 
      }

      /* Logo locked to top center */
      .hub__topbar {
        position: fixed;
        top: 15px; 
        left: 50%;
        transform: translateX(-50%);
        z-index: 50; 
      }
      
      .hub__brand img {
        height: 35px; 
      }

      /* Make the header flow naturally down the page */
      .hero-header {
        position: relative;
        width: 100%;
        padding: 8rem 5vw 2rem 5vw; 
        background: transparent; /* Let video show through */
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 10;
      }

      .hero-header h1 {
        font-size: 2.6rem;
      }

      .hero-header p {
        font-size: 0.95rem;
        padding: 0;
      }

      /* The container for the mobile cards */
      .hub {
        position: relative;
        width: 100%;
        height: auto;
        z-index: 5;
        padding-bottom: 4rem;
        background: transparent !important;
      }

      #hub-canvas {
        display: none;
      }

      .hub-mobile {
        position: relative;
        width: 100%;
        height: auto;
        padding: 2rem 5vw;
      }

      /* Format the mobile buttons to sit under the text */
      .hero-footer-buttons {
        position: relative;
        bottom: auto; left: auto;
        transform: none;
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        opacity: 0;
        animation: fadeIn 1.2s ease-out forwards;
        animation-delay: 1s;
      }

      .btn {
        width: 100%;
        text-align: center;
        padding: 1rem;
      }
    }

    /* ═══════════════════════════════════════════════
       SHARED TYPOGRAPHY & ANIMATIONS
       ═══════════════════════════════════════════════ */
    .hero-header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .hero-header h1 .highlight {
      color: #E86A34;
    }

    .hero-header p {
      font-family: 'Inter', sans-serif;
      color: #D0D8E8;
      line-height: 1.5;
      max-width: 650px;
      margin: 0 auto;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .word-wrap {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }

    .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%);
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Staggered Delays */
    .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; } .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; } .delay-6 { animation-delay: 0.6s; }
    .delay-7 { animation-delay: 0.7s; } .delay-8 { animation-delay: 0.8s; }
    .delay-9 { animation-delay: 0.9s; } .delay-10 { animation-delay: 1.0s; }
    .delay-11 { animation-delay: 1.1s; } .delay-12 { animation-delay: 1.2s; }
    .delay-13 { animation-delay: 1.3s; } .delay-14 { animation-delay: 1.4s; }
    .delay-15 { animation-delay: 1.5s; } .delay-16 { animation-delay: 1.6s; }
    .delay-17 { animation-delay: 1.7s; } .delay-18 { animation-delay: 1.8s; }
    .delay-19 { animation-delay: 1.9s; } .delay-20 { animation-delay: 2.0s; }
    .delay-21 { animation-delay: 2.1s; } .delay-22 { animation-delay: 2.2s; }
    .delay-23 { animation-delay: 2.3s; } .delay-24 { animation-delay: 2.4s; }
    .delay-25 { animation-delay: 2.5s; }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background-color: #E86A34;
      color: #FFFFFF;
      border: 2px solid #E86A34;
      box-shadow: 0 4px 15px rgba(232, 106, 52, 0.3);
    }
    .btn-primary:hover { 
      background-color: #d15b28; border-color: #d15b28; 
      transform: translateY(-2px); box-shadow: 0 10px 25px rgba(232, 106, 52, 0.5); 
    }

    .btn-secondary {
      background-color: rgba(12, 20, 40, 0.6);
      color: #FFFFFF;
      border: 2px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
    }
    .btn-secondary:hover { 
      border-color: #FFFFFF; background-color: rgba(255, 255, 255, 0.1); 
      transform: translateY(-2px); 
    }
  </style>
</head>

<body class="ps-hub">

  <div class="ps-cursor-dot"></div>
  <div class="ps-cursor-ring"></div>

  <!-- 1. BACKGROUND VIDEO -->
  <video class="bg-video" autoplay loop muted playsinline poster="images/about-bg.jpg">
    <source src="images/reception-bg.mp4" type="video/mp4">
  </video>

  <!-- 2. TOP TEXT OVERLAY -->
  <div class="hero-header">
    <h1>
      <span class="word-wrap"><span class="word delay-1">Turning</span></span>
      <span class="word-wrap"><span class="word delay-2">Data</span></span>
      <span class="word-wrap"><span class="word delay-3">into</span></span>
      <span class="word-wrap"><span class="word delay-4 highlight">Decisions</span></span>
    </h1>
    <p>
      <span class="word-wrap"><span class="word delay-5">We</span></span>
      <span class="word-wrap"><span class="word delay-6">partner</span></span>
      <span class="word-wrap"><span class="word delay-7">with</span></span>
      <span class="word-wrap"><span class="word delay-8">organizations</span></span>
      <span class="word-wrap"><span class="word delay-9">to</span></span>
      <span class="word-wrap"><span class="word delay-10">solve</span></span>
      <span class="word-wrap"><span class="word delay-11">business</span></span>
      <span class="word-wrap"><span class="word delay-12">challenges,</span></span>
      <span class="word-wrap"><span class="word delay-13">uncover</span></span>
      <span class="word-wrap"><span class="word delay-14">opportunities,</span></span>
      <span class="word-wrap"><span class="word delay-15">and</span></span>
      <span class="word-wrap"><span class="word delay-16">drive</span></span>
      <span class="word-wrap"><span class="word delay-17">growth</span></span>
      <span class="word-wrap"><span class="word delay-18">through</span></span>
      <span class="word-wrap"><span class="word delay-19">strategic</span></span>
      <span class="word-wrap"><span class="word delay-20">consulting,</span></span>
      <span class="word-wrap"><span class="word delay-21">research,</span></span>
      <span class="word-wrap"><span class="word delay-22">and</span></span>
      <span class="word-wrap"><span class="word delay-23">practical</span></span>
      <span class="word-wrap"><span class="word delay-24">business</span></span>
      <span class="word-wrap"><span class="word delay-25">solutions.</span></span>
    </p>

    <div class="hero-footer-buttons" id="mobileHeroBtns" style="display: none;">
      <a href="services.html" class="btn btn-primary">Explore Our Services</a>
      <a href="contact.html" class="btn btn-secondary">Partner with Us</a>
    </div>
  </div>

  <!-- 3. HUB / CARDS CONTAINER -->
  <div class="hub" id="hub">
    <div class="hub__backdrop" aria-hidden="true" style="display:none;"></div>
    <div class="hub__bg-image" aria-hidden="true" style="display:none;"></div>
    <div class="hub__bg-wash" aria-hidden="true" style="display:none;"></div>
    <div class="hub__vignette" aria-hidden="true" style="display:none;"></div>

    <canvas id="hub-canvas"></canvas>
    
    <div class="hub-mobile" id="hubMobile" aria-hidden="true"></div>

    <header class="hub__topbar">
      <a class="hub__brand" href="index.html" aria-label="PrimeStrategy Home">
        <img src="images/ps-logo-light.png" alt="PrimeStrategy">
      </a>
    </header>
  </div>

  <!-- 4. DESKTOP BOTTOM BUTTONS (Hidden on mobile) -->
  <div class="hero-footer-buttons" id="desktopHeroBtns">
    <a href="services.html" class="btn btn-primary">Explore Our Services</a>
    <a href="contact.html" class="btn btn-secondary">Partner with Us</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/hub.js"></script>

  <script>
    function toggleButtons() {
      if (window.innerWidth <= 900) {
        document.getElementById('mobileHeroBtns').style.display = 'flex';
        document.getElementById('desktopHeroBtns').style.display = 'none';
      } else {
        document.getElementById('mobileHeroBtns').style.display = 'none';
        document.getElementById('desktopHeroBtns').style.display = 'flex';
      }
    }
    window.addEventListener('resize', toggleButtons);
    toggleButtons();
  </script>

</body>
</html>
